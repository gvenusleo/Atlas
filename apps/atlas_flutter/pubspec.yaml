publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.2

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  atlas_config: ^0.1.0
  atlas_prompt: ^0.1.0
  atlas_provider: ^0.1.0
  atlas_runtime: ^0.1.0
  atlas_storage: ^0.1.0
  atlas_tools: ^0.1.0
  flutter_markdown: ^0.7.7+1
  flutter_pty: ^0.4.2
  flutter_riverpod: ^3.4.2
  go_router: ^17.4.0
  material_ui: ^1.0.0
  terminal_view: ^0.1.3
  window_manager: ^0.5.2
  lucide_icons_flutter: ^3.1.15

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
