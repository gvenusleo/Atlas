[tools]
go = "1.27.2"

[tasks.dev]
description = "启动交互 REPL"
run = "go run ./cmd/atlas"

[tasks.fmt]
description = "gofmt 格式化"
run = "gofmt -w ."

[tasks.vet]
description = "go vet 静态检查"
run = "go vet ./..."

[tasks.test]
description = "运行测试"
run = "go test ./... -count=1 -race"

[tasks.build]
description = "编译全部包"
run = "go build ./..."

[tasks.ci]
description = "CI：fmt → vet → test → build"
depends = ["fmt", "vet", "test", "build"]
