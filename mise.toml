[tools]
go = "1.27.2"

[tasks.dev]
description = "启动桌面应用（热重载）"
run = "go tool mygo dev"

[tasks.build]
description = "编译全部包"
run = "go tool mygo build"

[tasks.skills]
description = "更新 Agent Skills"
run = "npx skills update -p -y && go tool mygo install-skills"

[tasks.fmt]
description = "gofmt 格式化"
run = "gofmt -w ."

[tasks.fmt-check]
description = "检查格式，不改写文件"
run = "test -z \"$(gofmt -l .)\""

[tasks.vet]
description = "go vet 与 mygo vet 静态检查"
run = "go vet ./... && go tool mygo vet ."

[tasks.test]
description = "运行测试"
run = "go test ./... -count=1 -race"

[tasks.vuln]
description = "govulncheck 漏洞扫描"
run = "go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./..."

[tasks.ci]
description = "CI：fmt-check → vet → test → build → vuln"
depends = ["fmt-check", "vet", "test", "build", "vuln"]
