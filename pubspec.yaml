name: atlas_workspace
description: The Atlas Dart and Flutter monorepo.
publish_to: none

environment:
  sdk: ^3.12.2

workspace:
  - packages/atlas_runtime
  - packages/atlas_composition
  - packages/atlas_storage
  - packages/atlas_provider
  - packages/atlas_config
  - packages/atlas_prompt
  - packages/atlas_tools
  - packages/atlas_ws
  - packages/atlas_acp
  - packages/atlas_mcp
  - packages/atlas_tui
  - apps/atlas_cli
  - apps/atlas_flutter

dev_dependencies:
  lints: ^6.1.0

hooks:
  user_defines:
    sqlite3:
      source: system
      # Windows has no `sqlite3.dll`; the system ships `winsqlite3.dll`.
      name_windows: winsqlite3
