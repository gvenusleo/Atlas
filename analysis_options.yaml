include: package:lints/recommended.yaml

analyzer:
  exclude:
    - build/**
    - apps/atlas_cli/lib/src/version.dart # Generated by build_version.
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    public_member_api_docs: true
