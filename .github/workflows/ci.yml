name: CI

on:
  push:
    branches: [main, rewrite/go]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 检查格式
        run: test -z "$(gofmt -l .)"
      - name: 静态检查
        run: go vet ./... && go tool mygo vet .
      - name: 测试
        run: go test ./... -count=1 -race
      - name: 编译
        run: go build ./...
      - name: 漏洞扫描
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
