name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          cache: true
      - run: mise exec -- flutter pub get --enforce-lockfile
      - run: mise exec -- dart format --output=none --set-exit-if-changed packages apps/atlas_cli apps/atlasd apps/atlas_flutter/lib apps/atlas_flutter/test
      - run: mise exec -- dart analyze
      - name: Run Dart package tests
        run: |
          for package in packages/* apps/atlas_cli; do
            if [ -d "$package/test" ] && find "$package/test" -name '*_test.dart' -print -quit | grep -q .; then
              (cd "$package" && mise exec -- dart test)
            fi
          done
      - name: Run Flutter tests
        working-directory: apps/atlas_flutter
        run: mise exec -- flutter test --no-pub
