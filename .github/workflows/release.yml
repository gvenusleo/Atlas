name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # 草稿 Release，以及向它上传

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 标签与 mygo.json 的版本一致
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version mygo.json)"
      - name: 创建草稿 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi

  build:
    needs: draft-release
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: "darwin/arm64,darwin/amd64" }
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: 安装 NSIS，用来做 Windows 安装包
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: 导入 macOS 发布签名证书
        if: runner.os == 'macOS'
        shell: bash
        env:
          ATLAS_MACOS_CERTIFICATE_P12: ${{ secrets.ATLAS_MACOS_CERTIFICATE_P12 }}
          ATLAS_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.ATLAS_MACOS_CERTIFICATE_PASSWORD }}
          ATLAS_MACOS_SIGNING_IDENTITY: FA69ED0C1AE020718C546994B3AB48450341180F
        run: |
          : "${ATLAS_MACOS_CERTIFICATE_P12:?未配置 macOS 签名证书}"
          : "${ATLAS_MACOS_CERTIFICATE_PASSWORD:?未配置 macOS 签名证书密码}"
          certificate=$(mktemp "$RUNNER_TEMP/atlas-certificate.XXXXXX")
          trap 'rm -f "$certificate"' EXIT
          printf '%s' "$ATLAS_MACOS_CERTIFICATE_P12" | base64 --decode > "$certificate"

          keychain="$RUNNER_TEMP/atlas-signing.keychain-db"
          password=$(openssl rand -base64 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -k "$keychain" -f pkcs12 \
            -P "$ATLAS_MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain

          if ! security find-identity -v -p codesigning "$keychain" |
            awk -v identity="$ATLAS_MACOS_SIGNING_IDENTITY" '
              $2 == identity { found = 1 }
              END { exit !found }
            '; then
            echo '找不到与 Atlas 本机安装一致的有效签名身份' >&2
            exit 1
          fi
          printf 'ATLAS_MACOS_SIGNING_IDENTITY=%s\n' "$ATLAS_MACOS_SIGNING_IDENTITY" >> "$GITHUB_ENV"
      - name: 构建并上传
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.ATLAS_MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          go tool mygo build -platform "${{ matrix.platform }}" \
            -sign "${ATLAS_MACOS_SIGNING_IDENTITY:-}" -upload
